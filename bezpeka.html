<section><div class="wrap">
  <div class="alarm-box reveal" id="alarmBox" style="display:none">
    <h2>🚨 <span id="alarmTitle">Під час повітряної тривоги</span></h2>
    <ol id="alarmSteps"></ol>
  </div>

</div></section>

<script src="site.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  fetch('content/bezpeka.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    if(d.intro){var i=document.getElementById('bezIntro'); if(i)i.textContent=d.intro;}
    if(d.alarmSteps&&d.alarmSteps.length){
      document.getElementById('alarmBox').style.display='';
      if(d.alarmTitle)document.getElementById('alarmTitle').textContent=d.alarmTitle;
      document.getElementById('alarmSteps').innerHTML=d.alarmSteps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('');
    }
    var box=document.getElementById('safeGrid');
    if(box&&d.items&&d.items.length){
      box.innerHTML=d.items.map(function(x){
        return '<div class="pcard reveal"><div class="pe">'+esc(x.icon||'🛡️')+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div>';
      }).join('');
    }
  }).catch(function(){});
})();
</script>
