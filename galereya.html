<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comfortaa:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

</head>
<body data-page="galereya">
<main>
<section class="page-hero"><svg class="kalyna-deco" viewBox="0 0 120 120" aria-hidden="true"><g fill="#3c8c57"><path d="M60 8c-10 14-8 26 2 34 8-10 8-24-2-34z"/><path d="M28 26c2 16 12 24 24 24-2-14-12-22-24-24z"/><path d="M92 26c-12 2-22 10-24 24 12 0 22-8 24-24z"/></g><g fill="#e0364b"><circle cx="52" cy="70" r="11"/><circle cx="70" cy="76" r="11"/><circle cx="58" cy="90" r="11"/><circle cx="44" cy="86" r="9"/><circle cx="76" cy="94" r="9"/></g></svg><div class="wrap"><nav class="breadcrumbs"><a href="index.html">Головна</a> <span>/</span> Фотогалерея</nav><span class="script eyebrow">Життя Калинки</span><h1>Фотогалерея</h1><p class="lead">Найтепліші миті нашого садочка. Натисніть на фото, щоб переглянути більше.</p></div></section><section><div class="wrap"><div class="gal-grid" id="galGrid"><div class="gal-item reveal"><img src="images/sadochok.jpg" alt="Фото садочка"></div><div class="gal-item reveal">🌱</div><div class="gal-item reveal">🎵</div><div class="gal-item reveal"><img src="images/sadochok.jpg" alt="Фото садочка"></div><div class="gal-item reveal">❤️</div><div class="gal-item reveal">🎉</div><div class="gal-item reveal"><img src="images/sadochok.jpg" alt="Фото садочка"></div><div class="gal-item reveal">🧩</div></div><div class="center mt"><div class="ph-note reveal">✏️ Місце для реального наповнення — тексти, фото й документи додасть садочок.</div></div></div></section><div class="lightbox" id="lb"><span class="close">&times;</span><img id="lbImg" src="" alt=""></div>
</main>
<script src="site.js"></script>
<script>
(function(){
  var lb=document.getElementById('lb'), img=document.getElementById('lbImg');
  var grid=document.getElementById('galGrid');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function bind(){
    grid.querySelectorAll('.gal-item img').forEach(function(i){
      i.addEventListener('click',function(){img.src=i.src; lb.classList.add('open');});
    });
  }
  fetch('content/gallery.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.items&&d.items.length){
      grid.innerHTML=d.items.map(function(g){
        return '<div class="gal-item"><img src="'+esc(g.image)+'" alt="'+esc(g.caption||'Фото садочка')+'"></div>';
      }).join('');
    }
    bind();
  }).catch(bind);
  lb.addEventListener('click',function(){lb.classList.remove('open');});
})();
</script>
</body>
</html>
