<style>
.pp-card.clickable{cursor:pointer}
.pp-card .pp-cover{margin:-26px -26px 14px;height:150px;overflow:hidden;border-radius:calc(var(--r) - 6px) calc(var(--r) - 6px) 0 0}
.pp-card .pp-cover img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block;transition:transform .5s}
.pp-card.clickable:hover .pp-cover img{transform:scale(1.05)}
.pp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pp-meta span{background:var(--leaf-soft);color:var(--leaf-deep);border-radius:999px;padding:4px 11px;font-weight:800;font-size:.8rem}
.pp-open{display:inline-block;margin-top:10px;color:var(--kalyna);font-weight:800;font-size:.9rem}
.pp-bg{position:fixed;inset:0;z-index:9000;background:rgba(20,35,26,.6);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;animation:ppf .2s ease}
@keyframes ppf{from{opacity:0}to{opacity:1}}
.pp-sheet{background:var(--paper,#fffaf3);width:min(880px,100%);border-radius:26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;animation:ppu .25s ease}
@keyframes ppu{from{transform:translateY(16px)}to{transform:none}}
.pp-head{display:flex;align-items:center;gap:14px;padding:20px 24px;background:linear-gradient(135deg,var(--leaf),var(--leaf-deep));color:#fff}
.pp-head h2{margin:0;flex:1;font-family:'Comfortaa',cursive;font-size:1.3rem;color:#fff}
.pp-ico{font-size:1.9rem}
.pp-x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:1.1rem;cursor:pointer}
.pp-body{padding:22px 24px 28px}
.pp-text{color:var(--ink-soft);font-weight:600;line-height:1.65}
.pp-sub{font-family:'Comfortaa',cursive;color:var(--leaf-deep);font-size:1.05rem;margin:22px 0 12px}
.pp-sub span{background:var(--leaf-soft);border-radius:999px;padding:2px 10px;font-size:.8rem;margin-left:4px}
.pp-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pp-photos .pzoom{display:block;padding:0;border:0;border-radius:16px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;background:var(--leaf-soft);box-shadow:var(--shadow-soft)}
.pp-photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.pp-photos .pzoom:hover img{transform:scale(1.06)}
.pp-docs{display:flex;flex-direction:column;gap:8px}
.pp-doc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--ink);text-decoration:none;font-weight:700;transition:background .2s,transform .2s}
.pp-doc:hover{background:var(--leaf-soft);transform:translateX(3px)}
.pp-doc .di{font-size:1.4rem}.pp-doc .dt{flex:1;min-width:0}
.pp-doc .dk{font-size:.72rem;font-weight:800;color:var(--ink-soft);background:#f2f2ee;border-radius:6px;padding:2px 7px}
.pp-doc .dg{color:var(--leaf-deep);font-weight:800;font-size:.85rem;white-space:nowrap}
.pp-empty{color:var(--ink-soft);font-weight:700;text-align:center;margin:10px 0 0}
@media(max-width:560px){.pp-photos{grid-template-columns:repeat(2,1fr)}.pp-doc .dk{display:none}.pp-head{padding:16px 18px}.pp-body{padding:18px}}
</style>

<body data-page="pedprostir">
<main>
<section class="page-hero">
  <svg class="kalyna-deco" viewBox="0 0 120 120" aria-hidden="true"><g fill="#3c8c57"><path d="M60 8c-10 14-8 26 2 34 8-10 8-24-2-34z"/><path d="M28 26c2 16 12 24 24 24-2-14-12-22-24-24z"/><path d="M92 26c-12 2-22 10-24 24 12 0 22-8 24-24z"/></g><g fill="#e0364b"><circle cx="52" cy="70" r="11"/><circle cx="70" cy="76" r="11"/><circle cx="58" cy="90" r="11"/><circle cx="44" cy="86" r="9"/><circle cx="76" cy="94" r="9"/></g></svg>
  <div class="wrap">
    <nav class="breadcrumbs"><a href="index.html">Головна</a> <span>/</span> Педагогічний простір</nav>
    <span class="script eyebrow">Для наших педагогів</span>
    <h1>Педагогічний простір</h1>
    <div class="lead" id="ppIntro">Методика, ідеї, професійний розвиток і підтримка педагогів «Калинки».</div>
  </div>
</section>
<section><div class="wrap">
  <div class="grid-3" id="ppGrid"></div>
</div></section>
</main>
<script src="site.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  var RICH=window.kalynkaRich||function(x){return esc(x);};
  function ext(u){ var m=String(u||'').toLowerCase().split(/[?#]/)[0].match(/\.([a-z0-9]+)$/); return m?m[1]:''; }
  function docIcon(u){ var e=ext(u); if(e==='pdf')return '📕'; if(/^(doc|docx|odt|rtf|txt)$/.test(e))return '📘'; if(/^(xls|xlsx|ods)$/.test(e))return '📗'; if(/^(ppt|pptx|odp)$/.test(e))return '📙'; if(/^(jpg|jpeg|png|webp|gif)$/.test(e))return '🖼️'; return '🔗'; }
  function docKind(u){ var e=ext(u); return e?e.toUpperCase():'Посилання'; }
  var ITEMS=[];
  function detail(i){
    var x=ITEMS[i]; if(!x) return;
    var photos=(x.photos||[]).filter(Boolean), docs=(x.docs||[]).filter(function(d){return d&&(d.file||d.link);});
    var html='<div class="pp-sheet" role="dialog" aria-modal="true" aria-label="'+esc(x.title)+'">'+
      '<div class="pp-head"><span class="pp-ico">'+esc(x.icon||'📌')+'</span><h2>'+esc(x.title)+'</h2><button type="button" class="pp-x" aria-label="Закрити">✕</button></div>'+
      '<div class="pp-body">'+
        (x.text?'<div class="rtx pp-text">'+RICH(x.text)+'</div>':'')+
        (photos.length?'<h3 class="pp-sub">📷 Фото <span>'+photos.length+'</span></h3><div class="pp-photos">'+photos.map(function(src){
          return '<button type="button" class="pzoom" data-set="pp'+i+'" data-full="'+esc(src)+'" data-cap="'+esc(x.title)+'"><img src="'+esc(src)+'" alt="" loading="lazy"></button>';
        }).join('')+'</div>':'')+
        (docs.length?'<h3 class="pp-sub">📄 Документи <span>'+docs.length+'</span></h3><div class="pp-docs">'+docs.map(function(d){
          var u=d.file||d.link;
          return '<a class="pp-doc" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="di">'+docIcon(u)+'</span><span class="dt">'+esc(d.title||'Документ')+'</span><span class="dk">'+esc(docKind(u))+'</span><span class="dg">Відкрити →</span></a>';
        }).join('')+'</div>':'')+
        (!x.text&&!photos.length&&!docs.length?'<p class="pp-empty">Матеріали зʼявляться незабаром 🌱</p>':'')+
      '</div></div>';
    var bg=document.createElement('div'); bg.className='pp-bg'; bg.innerHTML=html;
    function close(){ bg.remove(); document.body.style.overflow=''; document.removeEventListener('keydown',onKey); if(location.hash) history.replaceState(null,'',location.pathname); }
    function onKey(e){ if(e.key==='Escape' && !document.querySelector('.k-lb')) close(); }
    bg.addEventListener('click',function(e){ if(e.target===bg||e.target.classList.contains('pp-x')) close(); });
    document.addEventListener('keydown',onKey);
    document.body.appendChild(bg); document.body.style.overflow='hidden';
    history.replaceState(null,'','#rozdil-'+(i+1));
  }
  fetch('content/pedprostir.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    if(d.intro){var i=document.getElementById('ppIntro'); if(i)kalynkaSetRich(i,d.intro);}
    var box=document.getElementById('ppGrid');
    ITEMS=d.items||[];
    if(box&&ITEMS.length){
      box.innerHTML=ITEMS.map(function(x,i){
        var ph=(x.photos||[]).filter(Boolean).length, dc=(x.docs||[]).filter(function(q){return q&&(q.file||q.link);}).length;
        var has=ph||dc;
        var meta=has?'<div class="pp-meta">'+(ph?'<span>📷 '+ph+' фото</span>':'')+(dc?'<span>📄 '+dc+' '+(dc===1?'документ':(dc<5?'документи':'документів'))+'</span>':'')+'</div><span class="pp-open">Переглянути →</span>':'';
        var cover=ph?'<div class="pp-cover"><img src="'+esc(x.photos[0])+'" alt="" loading="lazy"></div>':'';
        return '<div class="pcard reveal pp-card'+(has?' clickable':'')+'"'+(has?' data-i="'+i+'" tabindex="0" role="button"':'')+'>'+cover+'<div class="pe">'+esc(x.icon||'📌')+'</div><h3>'+esc(x.title)+'</h3><div class="rtx">'+RICH(x.text)+'</div>'+meta+'</div>';
      }).join('');
      box.addEventListener('click',function(e){ var c=e.target.closest('.pp-card.clickable'); if(c) detail(+c.getAttribute('data-i')); });
      box.addEventListener('keydown',function(e){ if(e.key==='Enter'){ var c=e.target.closest('.pp-card.clickable'); if(c) detail(+c.getAttribute('data-i')); } });
      var m=location.hash.match(/^#rozdil-(\d+)$/); if(m) detail(+m[1]-1);
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
