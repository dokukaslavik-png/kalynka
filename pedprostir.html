<script>
(function(){

  fetch('content/pedprostir.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){

    var box=document.getElementById('ppGrid');
    if(box&&d.items&&d.items.length){
      box.innerHTML=d.items.map(function(x){
        return '<div class="pcard reveal"><div class="pe">'+esc(x.icon||'📌')+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div>';

    }
  }).catch(function(){});
})();
