<style>
.vstup-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;align-items:start;margin-top:26px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:16px;background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow-soft);border:1px solid var(--line)}
.step .num{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--leaf),var(--leaf-deep));color:#fff;display:grid;place-items:center;font-family:'Comfortaa',cursive;font-weight:700;font-size:1.1rem}
.step h3{margin:2px 0 4px;color:var(--leaf-deep);font-size:1.1rem}
.step p{margin:0;color:var(--ink-soft);font-weight:600;font-size:.94rem;line-height:1.4}
.docs-card{background:linear-gradient(160deg,var(--leaf-soft),#fff);border-radius:22px;padding:22px 22px;box-shadow:var(--shadow-soft);border:1px solid var(--line);position:sticky;top:16px}
.docs-card h2{color:var(--leaf-deep);font-size:1.3rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.docs-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.docs-card li{display:flex;gap:9px;align-items:flex-start;color:var(--ink);font-weight:600;font-size:.94rem;line-height:1.4}
.docs-card li::before{content:'📄';flex:none}
.vstup-note{margin-top:24px}
@media(max-width:900px){.vstup-grid{grid-template-columns:1fr}.docs-card{position:static}}
</style>
</head>
<body data-page="vstup">
<main>
<section class="page-hero">
  <svg class="kalyna-deco" viewBox="0 0 120 120" aria-hidden="true"><g fill="#3c8c57"><path d="M60 8c-10 14-8 26 2 34 8-10 8-24-2-34z"/><path d="M28 26c2 16 12 24 24 24-2-14-12-22-24-24z"/><path d="M92 26c-12 2-22 10-24 24 12 0 22-8 24-24z"/></g><g fill="#e0364b"><circle cx="52" cy="70" r="11"/><circle cx="70" cy="76" r="11"/><circle cx="58" cy="90" r="11"/><circle cx="44" cy="86" r="9"/><circle cx="76" cy="94" r="9"/></g></svg>
  <div class="wrap">
    <nav class="breadcrumbs"><a href="index.html">Головна</a> <span>/</span> <a href="batkam.html">Батькам</a> <span>/</span> Як записати дитину</nav>
    <span class="script eyebrow">Ласкаво просимо</span>
    <h1>Як записати дитину</h1>
    <p class="lead" id="vstIntro">Кілька простих кроків — і ваш малюк у нашій родині.</p>
  </div>
</section>
<section><div class="wrap">
  <div class="vstup-grid">
    <div class="steps reveal" id="stepsBox"></div>
    <div class="docs-card reveal">
      <h2>📋 Потрібні документи</h2>
      <ul id="docsBox"></ul>
    </div>
  </div>
  <div class="center vstup-note"><div class="ph-note reveal" id="vstNote"></div></div>
  <div class="center mt"><a class="btn btn-primary" href="kontakty.html">📞 Звʼязатися з нами</a></div>
</div></section>
</main>
<script src="site.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  fetch('content/vstup.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    if(d.intro){var i=document.getElementById('vstIntro'); if(i)i.textContent=d.intro;}
    if(d.note){var n=document.getElementById('vstNote'); if(n)n.textContent='ℹ️ '+d.note;}
    var sb=document.getElementById('stepsBox');
    if(sb&&d.steps&&d.steps.length){
      sb.innerHTML=d.steps.map(function(x,idx){
        return '<div class="step reveal"><div class="num">'+(idx+1)+'</div><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div></div>';
      }).join('');
    }
    var db=document.getElementById('docsBox');
    if(db&&d.documents&&d.documents.length){
      db.innerHTML=d.documents.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
    }
  }).catch(function(){});
})();
</script>
</body>
