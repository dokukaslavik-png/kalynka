<script>
/* Документи з content/documents.json (редагується в адмінці) */
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var box=document.getElementById('docGrid');
  fetch('content/documents.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!box||!d||!d.items||!d.items.length)return;
    box.innerHTML=d.items.map(function(x){
      var href=x.file?esc(x.file):'#';
      var attr=x.file?' target="_blank" rel="noopener"':'';
      return '<a class="dlink" href="'+href+'"'+attr+'><span class="di">'+esc(x.icon||'📄')+'</span> '+esc(x.title)+'</a>';
    }).join('');
  }).catch(function(){});
})();
</script>
