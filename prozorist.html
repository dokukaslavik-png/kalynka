<style>
.pz-list{display:flex;flex-direction:column;gap:12px;margin-top:26px;max-width:900px;margin-left:auto;margin-right:auto}
.pz{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:14px 18px;box-shadow:var(--shadow-soft);border:1px solid var(--line);border-left:5px solid var(--leaf)}
.pz .n{flex:none;width:38px;height:38px;border-radius:11px;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;font-family:'Comfortaa',cursive;font-weight:700;font-size:.95rem}
.pz .pz-main{flex:1;min-width:0}
.pz .pz-title{color:var(--ink);font-weight:700;font-size:1rem;line-height:1.3}
.pz .pz-note{color:var(--ink-soft);font-weight:600;font-size:.85rem;margin-top:2px}
.pz .pz-act{flex:none}
.pz .open{display:inline-flex;align-items:center;gap:6px;background:var(--leaf);color:#fff;border-radius:10px;padding:8px 15px;font-weight:800;font-size:.88rem;text-decoration:none;white-space:nowrap}
.pz .open:hover{background:var(--leaf-deep)}
.pz .soon{color:var(--ink-soft);font-weight:700;font-size:.82rem;opacity:.7;white-space:nowrap}
@media(max-width:560px){.pz{flex-wrap:wrap;gap:10px}.pz .pz-main{flex:1 1 100%;order:2}.pz .n{order:1}.pz .pz-act{order:3;margin-left:auto}}

<script src="site.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  fetch('content/prozorist.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;
    if(d.intro){var i=document.getElementById('pzIntro'); if(i)i.textContent=d.intro;}
    var box=document.getElementById('pzList');
    if(box&&d.items&&d.items.length){
      box.innerHTML=d.items.map(function(x,idx){
        var href = x.file || x.link || '';
        var act = href
          ? '<a class="open" href="'+esc(href)+'" target="_blank" rel="noopener">📄 Відкрити</a>'
          : '<span class="soon">незабаром</span>';
        var note = x.note ? '<div class="pz-note">'+esc(x.note)+'</div>' : '';
        return '<div class="pz reveal"><div class="n">'+(idx+1)+'</div>'+
          '<div class="pz-main"><div class="pz-title">'+esc(x.title)+'</div>'+note+'</div>'+
          '<div class="pz-act">'+act+'</div></div>';
      }).join('');
    }
  }).catch(function(){});
})();
</script>
