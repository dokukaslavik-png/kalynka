              - { label: "Групи та вихователі", name: groups, widget: list, label_singular: "Група", summary: "№{{fields.num}} {{fields.name}}", fields: [ { label: "Номер групи", name: num, widget: string, required: false }, { label: "Назва групи", name: name, widget: string, required: false }, { label: "Інклюзивна група", name: inclusive, widget: boolean, required: false }, { label: "Педагоги групи", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Посада", name: role, widget: string }, { label: "ПІБ", name: name, widget: string }, { label: "Категорія, стаж, освіта", name: info, widget: string, required: false }, { label: "Педагогічне кредо", name: credo, widget: text, required: false }, { label: "Фото", name: photo, widget: image, required: false } ] } ] }
          - label: "Середні групи"
            name: seredni
            widget: object
            fields:
              - { label: "Опис «Про групу» (абзаци)", name: about, widget: list, label_singular: "Абзац", field: { label: "Абзац", name: item, widget: text } }
              - { label: "Що розвиваємо (пункти)", name: develop, widget: list, label_singular: "Пункт", field: { label: "Пункт", name: item, widget: string } }
              - { label: "Заняття", name: activities, widget: list, label_singular: "Заняття", summary: "{{fields.title}}", fields: [ { label: "Емодзі", name: emoji, widget: string, required: false }, { label: "Назва", name: title, widget: string }, { label: "Опис", name: text, widget: text } ] }
              - { label: "Групи та вихователі", name: groups, widget: list, label_singular: "Група", summary: "№{{fields.num}} {{fields.name}}", fields: [ { label: "Номер групи", name: num, widget: string, required: false }, { label: "Назва групи", name: name, widget: string, required: false }, { label: "Інклюзивна група", name: inclusive, widget: boolean, required: false }, { label: "Педагоги групи", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Посада", name: role, widget: string }, { label: "ПІБ", name: name, widget: string }, { label: "Категорія, стаж, освіта", name: info, widget: string, required: false }, { label: "Педагогічне кредо", name: credo, widget: text, required: false }, { label: "Фото", name: photo, widget: image, required: false } ] } ] }
          - label: "Старші групи"
            name: starshi
            widget: object
            fields:
              - { label: "Опис «Про групу» (абзаци)", name: about, widget: list, label_singular: "Абзац", field: { label: "Абзац", name: item, widget: text } }
              - { label: "Що розвиваємо (пункти)", name: develop, widget: list, label_singular: "Пункт", field: { label: "Пункт", name: item, widget: string } }
              - { label: "Заняття", name: activities, widget: list, label_singular: "Заняття", summary: "{{fields.title}}", fields: [ { label: "Емодзі", name: emoji, widget: string, required: false }, { label: "Назва", name: title, widget: string }, { label: "Опис", name: text, widget: text } ] }
              - { label: "Групи та вихователі", name: groups, widget: list, label_singular: "Група", summary: "№{{fields.num}} {{fields.name}}", fields: [ { label: "Номер групи", name: num, widget: string, required: false }, { label: "Назва групи", name: name, widget: string, required: false }, { label: "Інклюзивна група", name: inclusive, widget: boolean, required: false }, { label: "Педагоги групи", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Посада", name: role, widget: string }, { label: "ПІБ", name: name, widget: string }, { label: "Категорія, стаж, освіта", name: info, widget: string, required: false }, { label: "Педагогічне кредо", name: credo, widget: text, required: false }, { label: "Фото", name: photo, widget: image, required: false } ] } ] }
          - label: "Інклюзивна група"
            name: inklyuziya
            widget: object
            fields:
              - { label: "Опис «Про групу» (абзаци)", name: about, widget: list, label_singular: "Абзац", field: { label: "Абзац", name: item, widget: text } }
              - { label: "Що розвиваємо (пункти)", name: develop, widget: list, label_singular: "Пункт", field: { label: "Пункт", name: item, widget: string } }
              - { label: "Заняття", name: activities, widget: list, label_singular: "Заняття", summary: "{{fields.title}}", fields: [ { label: "Емодзі", name: emoji, widget: string, required: false }, { label: "Назва", name: title, widget: string }, { label: "Опис", name: text, widget: text } ] }
              - { label: "Групи та вихователі", name: groups, widget: list, label_singular: "Група", summary: "№{{fields.num}} {{fields.name}}", fields: [ { label: "Номер групи", name: num, widget: string, required: false }, { label: "Назва групи", name: name, widget: string, required: false }, { label: "Інклюзивна група", name: inclusive, widget: boolean, required: false }, { label: "Педагоги групи", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Посада", name: role, widget: string }, { label: "ПІБ", name: name, widget: string }, { label: "Категорія, стаж, освіта", name: info, widget: string, required: false }, { label: "Педагогічне кредо", name: credo, widget: text, required: false }, { label: "Фото", name: photo, widget: image, required: false } ] } ] }

  - name: home
    label: "Головна сторінка"
    files:
      - name: home
        label: "Тексти головної"
        file: "content/home.json"
        editor:
          preview: false
        fields:
          - { label: "Підзаголовок «Про нас»", name: aboutEyebrow, widget: string }
          - { label: "Заголовок «Про нас»", name: aboutTitle, widget: string }
          - label: "Текст «Про нас» (абзаци)"
            name: about
            widget: list
            label_singular: "Абзац"
            field: { label: "Абзац", name: item, widget: text }
          - label: "Цитати дітей"
            name: voices
            widget: list
            label_singular: "Цитата"
            summary: "{{fields.kid}}"
            fields:
              - { label: "Цитата", name: text, widget: text }
              - { label: "Хто сказав", name: kid, widget: string, hint: "Напр.: Софійка, 5 років" }
              - { label: "Емодзі", name: avatar, widget: string, required: false }

  - name: projects
    label: "Проєкти"
    files:
      - name: list
        label: "Проєкти (список)"
        file: "content/projects.json"
        editor:
          preview: false
        fields:
          - label: "Проєкти"
            name: items
            widget: list
            label_singular: "Проєкт"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: emoji, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }

  - name: parents
    label: "Батькам"
    files:
      - name: list
        label: "Розділи «Батькам»"
        file: "content/parents.json"
        editor:
          preview: false
        fields:
          - label: "Картки"
            name: items
            widget: list
            label_singular: "Картка"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: icon, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }

  - name: gurtky
    label: "Гуртки"
    files:
      - name: list
        label: "Гуртки (список)"
        file: "content/gurtky.json"
        editor:
          preview: false
        fields:
          - label: "Гуртки"
            name: items
            widget: list
            label_singular: "Гурток"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: emoji, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }

  - name: menu
    label: "Меню харчування"
    files:
      - name: menu
        label: "Меню на тиждень"
        file: "content/menu.json"
        editor:
          preview: false
        fields:
          - { label: "Вступний текст", name: intro, widget: text }
          - { label: "Примітка", name: note, widget: text, required: false }
          - label: "Дні тижня"
            name: days
            widget: list
            label_singular: "День"
            summary: "{{fields.day}}"
            fields:
              - { label: "День тижня", name: day, widget: string }
              - { label: "Сніданок", name: breakfast, widget: string, required: false }
              - { label: "Обід", name: lunch, widget: string, required: false }
              - { label: "Підвечірок", name: snack, widget: string, required: false }
              - { label: "Вечеря", name: supper, widget: string, required: false }

  - name: rezhym
    label: "Розпорядок дня"
    files:
      - name: rezhym
        label: "Режим дня"
        file: "content/rezhym.json"
        editor:
          preview: false
        fields:
          - { label: "Вступний текст", name: intro, widget: text }
          - { label: "Примітка", name: note, widget: text, required: false }
          - label: "Пункти режиму"
            name: items
            widget: list
            label_singular: "Пункт"
            summary: "{{fields.time}} — {{fields.title}}"
            fields:
              - { label: "Час (напр.: 8:30 – 9:00)", name: time, widget: string }
              - { label: "Емодзі", name: icon, widget: string, required: false }
              - { label: "Що відбувається", name: title, widget: string }

  - name: bezpeka
    label: "Безпека та укриття"
    files:
      - name: bezpeka
        label: "Безпека"
        file: "content/bezpeka.json"
        editor:
          preview: false
        fields:
          - { label: "Вступний текст", name: intro, widget: text }
          - { label: "Заголовок блоку тривоги", name: alarmTitle, widget: string }
          - label: "Дії під час тривоги (по кроках)"
            name: alarmSteps
            widget: list
            label_singular: "Крок"
            field: { label: "Крок", name: item, widget: text }
          - label: "Картки безпеки"
            name: items
            widget: list
            label_singular: "Картка"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: icon, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }

  - name: vstup
    label: "Як записати дитину"
    files:
      - name: vstup
        label: "Вступ до садочка"
        file: "content/vstup.json"
        editor:
          preview: false
        fields:
          - { label: "Вступний текст", name: intro, widget: text }
          - label: "Кроки зарахування"
            name: steps
            widget: list
            label_singular: "Крок"
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва кроку", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }
          - label: "Перелік документів"
            name: documents
            widget: list
            label_singular: "Документ"
            field: { label: "Документ", name: item, widget: string }
          - { label: "Примітка", name: note, widget: text, required: false }

  - name: prozorist
    label: "Прозорість та відкритість"
    files:
      - name: prozorist
        label: "Прозорість (документи)"
        file: "content/prozorist.json"
        editor:
          preview: false
        fields:
          - { label: "Вступний текст", name: intro, widget: text }
          - label: "Пункти"
            name: items
            widget: list
            label_singular: "Пункт"
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: title, widget: string }
              - { label: "Файл PDF", name: file, widget: file, required: false }
              - { label: "Посилання (замість файлу)", name: link, widget: string, required: false }
              - { label: "Примітка", name: note, widget: string, required: false }

  - name: pedprostir
    label: "Педагогічний простір"
    files:
      - name: pedprostir
        label: "Педагогічний простір"
        file: "content/pedprostir.json"
        editor:
          preview: false
        fields:
          - { label: "Вступний текст", name: intro, widget: text }
          - label: "Підрозділи"
            name: items
            widget: list
            label_singular: "Підрозділ"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: icon, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }
