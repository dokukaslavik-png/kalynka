              - { label: "Опис «Про групу» (абзаци)", name: about, widget: list, label_singular: "Абзац", field: { label: "Абзац", name: item, widget: text } }
              - { label: "Що розвиваємо (пункти)", name: develop, widget: list, label_singular: "Пункт", field: { label: "Пункт", name: item, widget: string } }
              - { label: "Заняття", name: activities, widget: list, label_singular: "Заняття", summary: "{{fields.title}}", fields: [ { label: "Емодзі", name: emoji, widget: string, required: false }, { label: "Назва", name: title, widget: string }, { label: "Опис", name: text, widget: text } ] }
              - { label: "Групи та вихователі", name: groups, widget: list, label_singular: "Група", summary: "№{{fields.num}} {{fields.name}}", fields: [ { label: "Номер групи", name: num, widget: string, required: false }, { label: "Назва групи", name: name, widget: string, required: false }, { label: "Інклюзивна група", name: inclusive, widget: boolean, required: false }, { label: "Педагоги групи", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Посада", name: role, widget: string }, { label: "ПІБ", name: name, widget: string }, { label: "Категорія, стаж, освіта", name: info, widget: string, required: false }, { label: "Педагогічне кредо", name: credo, widget: text, required: false }, { label: "Фото", name: photo, widget: image, required: false } ] } ] }
          - label: "Молодші групи"
            name: molodshi
            widget: object
            fields:
              - { label: "Опис «Про групу» (абзаци)", name: about, widget: list, label_singular: "Абзац", field: { label: "Абзац", name: item, widget: text } }
