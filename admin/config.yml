backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: settings
    label: "Налаштування сайту"
    files:
      - name: contacts
        label: "Контакти та назва закладу"
        file: "content/settings.json"
        editor:
          preview: false
        fields:
          - { label: "Коротка назва", name: name, widget: string }
          - { label: "Повна офіційна назва", name: full, widget: string }
          - { label: "Адреса", name: addr, widget: string }
          - { label: "Телефон", name: phone, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Графік роботи", name: hours, widget: string }
          - { label: "Facebook (посилання)", name: facebook, widget: string, required: false }
          - { label: "Telegram (посилання)", name: telegram, widget: string, required: false }
          - { label: "YouTube (посилання)", name: youtube, widget: string, required: false }

  - name: news
    label: "Новини"
    files:
      - name: list
        label: "Новини (список)"
        file: "content/news.json"
        editor:
          preview: false
        fields:
          - label: "Новини"
            name: items
            widget: list
            label_singular: "Новина"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Дата", name: date, widget: string, hint: "Напр.: 05 вересня 2025" }
              - { label: "Заголовок", name: title, widget: string }
              - { label: "Текст (необовʼязково)", name: text, widget: text, required: false }
              - { label: "Фото (необовʼязково)", name: image, widget: image, required: false }

  - name: events
    label: "Афіша подій"
    files:
      - name: list
        label: "Події (список)"
        file: "content/events.json"
        editor:
          preview: false
        fields:
          - label: "Події"
            name: items
            widget: list
            label_singular: "Подія"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Дата", name: date, widget: string, hint: "Напр.: 15 вересня" }
              - { label: "Назва події", name: title, widget: string }
              - { label: "Опис (необовʼязково)", name: desc, widget: string, required: false }
              - { label: "Емодзі (необовʼязково)", name: icon, widget: string, required: false, hint: "Напр.: 🎨 🎵 🌳" }

  - name: gallery
    label: "Фотогалерея"
    files:
      - name: list
        label: "Фото галереї"
        file: "content/gallery.json"
        editor:
          preview: false
        fields:
          - label: "Фотографії"
            name: items
            widget: list
            label_singular: "Фото"
            fields:
              - { label: "Фото", name: image, widget: image }
              - { label: "Підпис (необовʼязково)", name: caption, widget: string, required: false }

  - name: documents
    label: "Документи"
    files:
      - name: list
        label: "Документи (список)"
        file: "content/documents.json"
        editor:
          preview: false
        fields:
          - label: "Документи"
            name: items
            widget: list
            label_singular: "Документ"
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: title, widget: string }
              - { label: "Емодзі (необовʼязково)", name: icon, widget: string, required: false }
              - { label: "Файл PDF (необовʼязково)", name: file, widget: file, required: false }

  - name: about
    label: "Про заклад"
    files:
      - name: about
        label: "Тексти сторінки «Про заклад»"
        file: "content/about.json"
        editor:
          preview: false
        fields:
          - label: "Вступ (абзаци)"
            name: intro
            widget: list
            label_singular: "Абзац"
            field: { label: "Абзац", name: item, widget: text }
          - label: "Історія (абзаци)"
            name: history
            widget: list
            label_singular: "Абзац"
            field: { label: "Абзац", name: item, widget: text }
          - label: "Адміністрація"
            name: admin
            widget: list
            label_singular: "Людина"
            summary: "{{fields.role}} — {{fields.name}}"
            fields:
              - { label: "Посада", name: role, widget: string }
              - { label: "Прізвище, ім'я та по батькові", name: name, widget: string }
              - { label: "Фото (необовʼязково)", name: photo, widget: image, required: false }

  - name: groups
    label: "Групи — вихователі"
    files:
      - name: teachers
        label: "Вихователі груп"
        file: "content/groups.json"
        editor:
          preview: false
        fields:
          - label: "Ранній вік"
            name: ranniy
            widget: object
            fields:
              - { label: "Вихователі", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Роль", name: role, widget: string }, { label: "Прізвище, ім'я та по батькові", name: name, widget: string }, { label: "Фото", name: photo, widget: image, required: false } ] }
          - label: "Молодші групи"
            name: molodshi
            widget: object
            fields:
              - { label: "Вихователі", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Роль", name: role, widget: string }, { label: "Прізвище, ім'я та по батькові", name: name, widget: string }, { label: "Фото", name: photo, widget: image, required: false } ] }
          - label: "Середні групи"
            name: seredni
            widget: object
            fields:
              - { label: "Вихователі", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Роль", name: role, widget: string }, { label: "Прізвище, ім'я та по батькові", name: name, widget: string }, { label: "Фото", name: photo, widget: image, required: false } ] }
          - label: "Старші групи"
            name: starshi
            widget: object
            fields:
              - { label: "Вихователі", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Роль", name: role, widget: string }, { label: "Прізвище, ім'я та по батькові", name: name, widget: string }, { label: "Фото", name: photo, widget: image, required: false } ] }
          - label: "Інклюзивна група"
            name: inklyuziya
            widget: object
            fields:
              - { label: "Вихователі", name: teachers, widget: list, label_singular: "Педагог", summary: "{{fields.role}} — {{fields.name}}", fields: [ { label: "Роль", name: role, widget: string }, { label: "Прізвище, ім'я та по батькові", name: name, widget: string }, { label: "Фото", name: photo, widget: image, required: false } ] }

  - name: home
    label: "Головна сторінка"
    files:
      - name: home
        label: "Тексти головної"
        file: "content/home.json"
        editor:
          preview: false
        fields:
          - { label: "Підзаголовок «Про нас»", name: aboutEyebrow, widget: string }
          - { label: "Заголовок «Про нас»", name: aboutTitle, widget: string }
          - label: "Текст «Про нас» (абзаци)"
            name: about
            widget: list
            label_singular: "Абзац"
            field: { label: "Абзац", name: item, widget: text }
          - label: "Цитати дітей"
            name: voices
            widget: list
            label_singular: "Цитата"
            summary: "{{fields.kid}}"
            fields:
              - { label: "Цитата", name: text, widget: text }
              - { label: "Хто сказав", name: kid, widget: string, hint: "Напр.: Софійка, 5 років" }
              - { label: "Емодзі", name: avatar, widget: string, required: false }

  - name: projects
    label: "Проєкти"
    files:
      - name: list
        label: "Проєкти (список)"
        file: "content/projects.json"
        editor:
          preview: false
        fields:
          - label: "Проєкти"
            name: items
            widget: list
            label_singular: "Проєкт"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: emoji, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }

  - name: parents
    label: "Батькам"
    files:
      - name: list
        label: "Розділи «Батькам»"
        file: "content/parents.json"
        editor:
          preview: false
        fields:
          - label: "Картки"
            name: items
            widget: list
            label_singular: "Картка"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: icon, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }

  - name: gurtky
    label: "Гуртки"
    files:
      - name: list
        label: "Гуртки (список)"
        file: "content/gurtky.json"
        editor:
          preview: false
        fields:
          - label: "Гуртки"
            name: items
            widget: list
            label_singular: "Гурток"
            summary: "{{fields.title}}"
            fields:
              - { label: "Емодзі", name: emoji, widget: string, required: false }
              - { label: "Назва", name: title, widget: string }
              - { label: "Опис", name: text, widget: text }
